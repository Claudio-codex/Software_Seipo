# Conexión de SEIPO con la base de datos (MariaDB o MySQL).
# Copia este archivo como config.properties en la misma carpeta y ajusta los valores.
# config.properties no se sube al repositorio.
db.host=localhost
db.puerto=3306
db.base=seipo_db
# Clave de práctica: cámbiala si usas el sistema con datos reales.
db.usuario=seipo
db.clave=Seipo2026

# Ruta de mariadb-dump.exe o mysqldump.exe para respaldo.bat (opcional; solo la usa el respaldo).
# Si no se indica, se busca en C:\Program Files\MariaDB 12.3\bin, en C:\xampp\mysql\bin y en el PATH.
#respaldo.dump=C:\Program Files\MariaDB 12.3\bin\mariadb-dump.exe
